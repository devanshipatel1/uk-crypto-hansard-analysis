name: Build final Hansard corpus

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_final_hansard_corpus.py'
      - 'data/raw/hansard_debate_registry_2020_2025.csv'
      - '.github/workflows/build-final-hansard-corpus.yml'

permissions:
  contents: write

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install corpus-build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml

      - name: Normalize debate registry CSV
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          p = Path('data/raw/hansard_debate_registry_2020_2025.csv')
          rows = list(csv.reader(p.open(newline='', encoding='utf-8')))
          fixed = []
          for i, row in enumerate(rows):
              if i == 0:
                  fixed.append(row)
                  continue
              if len(row) < 8:
                  raise SystemExit(f'Registry row {i+1} has only {len(row)} fields: {row}')
              if len(row) > 8:
                  row = row[:4] + [','.join(row[4:-3])] + row[-3:]
              fixed.append(row)

          with p.open('w', newline='', encoding='utf-8') as f:
              csv.writer(f).writerows(fixed)
          print(f'Normalized {len(fixed)-1} registry rows.')
          PY

      - name: Build speech-level Hansard corpus
        id: build
        continue-on-error: true
        run: python scripts/build_final_hansard_corpus.py

      - name: Show corpus build diagnostics
        if: always()
        run: |
          echo '--- corpus_build_log.csv ---'
          if [ -f outputs/tables/corpus_build_log.csv ]; then
            cat outputs/tables/corpus_build_log.csv
          else
            echo 'No corpus build log was produced.'
          fi
          echo '--- final_corpus_qa_summary.csv ---'
          if [ -f outputs/tables/final_corpus_qa_summary.csv ]; then
            cat outputs/tables/final_corpus_qa_summary.csv
          else
            echo 'No QA summary was produced.'
          fi

      - name: Commit generated corpus and diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- data/raw/hansard_debate_registry_2020_2025.csv
          for f in \
            data/processed/hansard_contributions_unfiltered_2020_2025.csv \
            data/processed/hansard_crypto_2020_2025_final.csv \
            outputs/tables/corpus_build_log.csv \
            outputs/tables/final_corpus_qa_summary.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Update Hansard corpus build outputs and diagnostics'
            git push
          fi

      - name: Fail workflow if corpus build failed
        if: steps.build.outcome != 'success'
        run: exit 1
