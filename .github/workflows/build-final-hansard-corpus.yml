name: Build final Hansard corpus

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_final_hansard_corpus.py'
      - 'data/raw/hansard_debate_registry_2020_2025.csv'
      - '.github/workflows/build-final-hansard-corpus.yml'

permissions:
  contents: write

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install corpus-build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml

      - name: Normalize debate registry CSV
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          p = Path('data/raw/hansard_debate_registry_2020_2025.csv')
          rows = list(csv.reader(p.open(newline='', encoding='utf-8')))
          fixed = []
          for i, row in enumerate(rows):
              if i == 0:
                  fixed.append(row)
                  continue
              if len(row) < 8:
                  raise SystemExit(f'Registry row {i+1} has only {len(row)} fields: {row}')
              if len(row) > 8:
                  # Preserve the first four fixed fields and the final three fixed fields;
                  # any extra commas belong to the debate title.
                  row = row[:4] + [','.join(row[4:-3])] + row[-3:]
              fixed.append(row)

          with p.open('w', newline='', encoding='utf-8') as f:
              csv.writer(f).writerows(fixed)
          print(f'Normalized {len(fixed)-1} registry rows.')
          PY

      - name: Build speech-level Hansard corpus
        run: python scripts/build_final_hansard_corpus.py

      - name: Show corpus QA summary
        run: |
          echo '--- final_corpus_qa_summary.csv ---'
          cat outputs/tables/final_corpus_qa_summary.csv
          echo '--- build failures / warnings ---'
          python - <<'PY'
          import pandas as pd
          p='outputs/tables/corpus_build_log.csv'
          d=pd.read_csv(p)
          print(d[d['parse_status']!='ok'].to_string(index=False) if (d['parse_status']!='ok').any() else 'No parse failures')
          PY

      - name: Commit generated corpus and QA outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- data/raw/hansard_debate_registry_2020_2025.csv
          git add data/processed/hansard_contributions_unfiltered_2020_2025.csv \
                  data/processed/hansard_crypto_2020_2025_final.csv \
                  outputs/tables/corpus_build_log.csv \
                  outputs/tables/final_corpus_qa_summary.csv
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Build final speech-level Hansard corpus'
            git push
          fi
