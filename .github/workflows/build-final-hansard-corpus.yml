name: Build final Hansard corpus

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_final_hansard_corpus.py'
      - 'data/raw/hansard_debate_registry_2020_2025.csv'
      - 'data/raw/debate_id_overrides.csv'
      - '.github/workflows/build-final-hansard-corpus.yml'

permissions:
  contents: write

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install corpus-build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml

      - name: Normalize registry and apply child-debate overrides
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          registry_path = Path('data/raw/hansard_debate_registry_2020_2025.csv')
          override_path = Path('data/raw/debate_id_overrides.csv')

          rows = list(csv.reader(registry_path.open(newline='', encoding='utf-8')))
          fixed = []
          for i, row in enumerate(rows):
              if i == 0:
                  fixed.append(row)
                  continue
              if len(row) < 8:
                  raise SystemExit(f'Registry row {i+1} has only {len(row)} fields: {row}')
              if len(row) > 8:
                  row = row[:4] + [','.join(row[4:-3])] + row[-3:]
              fixed.append(row)

          if override_path.exists():
              overrides = list(csv.DictReader(override_path.open(newline='', encoding='utf-8')))
              header = fixed[0]
              idx = {name: pos for pos, name in enumerate(header)}
              applied = 0
              for row in fixed[1:]:
                  for ov in overrides:
                      if row[idx['date']] == ov['date'] and row[idx['debate_title']] == ov['debate_title']:
                          url = row[idx['source_url']]
                          parent = ov['parent_debate_id']
                          target = ov['target_debate_id']
                          if parent not in url:
                              raise SystemExit(
                                  f"Override parent ID {parent} not found in URL for "
                                  f"{ov['date']} {ov['debate_title']}: {url}"
                              )
                          row[idx['source_url']] = url.replace(parent, target, 1)
                          applied += 1
              if applied != len(overrides):
                  raise SystemExit(f'Applied {applied} overrides but expected {len(overrides)}.')
              print(f'Applied {applied} child-debate ID overrides.')

          with registry_path.open('w', newline='', encoding='utf-8') as f:
              csv.writer(f).writerows(fixed)
          print(f'Normalized {len(fixed)-1} registry rows.')
          PY

      - name: Build speech-level Hansard corpus
        id: build
        continue-on-error: true
        run: python scripts/build_final_hansard_corpus.py

      - name: Show corpus build diagnostics
        if: always()
        run: |
          echo '--- corpus_build_log.csv ---'
          if [ -f outputs/tables/corpus_build_log.csv ]; then
            cat outputs/tables/corpus_build_log.csv
          else
            echo 'No corpus build log was produced.'
          fi
          echo '--- final_corpus_qa_summary.csv ---'
          if [ -f outputs/tables/final_corpus_qa_summary.csv ]; then
            cat outputs/tables/final_corpus_qa_summary.csv
          else
            echo 'No QA summary was produced.'
          fi

      - name: Commit generated corpus and diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- data/raw/hansard_debate_registry_2020_2025.csv
          for f in \
            data/processed/hansard_contributions_unfiltered_2020_2025.csv \
            data/processed/hansard_crypto_2020_2025_final.csv \
            outputs/tables/corpus_build_log.csv \
            outputs/tables/final_corpus_qa_summary.csv; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Update corrected Hansard corpus build outputs'
            git pull --rebase origin main
            git push origin main
          fi

      - name: Fail workflow if corpus build failed
        if: steps.build.outcome != 'success'
        run: exit 1
